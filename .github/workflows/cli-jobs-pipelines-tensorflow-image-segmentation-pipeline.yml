name: cli-jobs-pipelines-tensorflow-image-segmentation-pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "54 5/12 * * *"
  pull_request:
    branches:
      - main
    paths:
      - cli//**
      - infra/bootstrapping/**
      - .github/workflows/cli-jobs-pipelines-tensorflow-image-segmentation-pipeline.yml
      - cli/run-pipeline-jobs.sh
      - cli/setup.sh
permissions:
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: check out repo
      uses: actions/checkout@v2
    - name: azure login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.OIDC_AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.OIDC_AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.OIDC_AZURE_SUBSCRIPTION_ID }}
    - name: bootstrap resources
      run: |
          echo '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}';
          bash bootstrap.sh
      working-directory: infra/bootstrapping
      continue-on-error: false
    - name: setup-cli
      run: |
          source "${{ github.workspace }}/infra/bootstrapping/sdk_helpers.sh";
          source "${{ github.workspace }}/infra/bootstrapping/init_environment.sh";
          bash setup.sh
      working-directory: cli
      continue-on-error: true
    - name: Eagerly cache access tokens for required scopes
      run: |
          # Workaround for azure-cli's lack of support for ID token refresh
          # Taken from: https://github.com/Azure/login/issues/372#issuecomment-2056289617

          # Management
          az account get-access-token --scope https://management.azure.com/.default --output none
          # ML
          az account get-access-token --scope https://ml.azure.com/.default --output none
    - name: Download Oxford Pets dataset
      run: |
          mkdir -p data
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --output data/images.tar.gz https://www.robots.ox.ac.uk/~vgg/data/pets/data/images.tar.gz
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --output data/annotations.tar.gz https://www.robots.ox.ac.uk/~vgg/data/pets/data/annotations.tar.gz
      working-directory: cli/
    - name: run job
      run: |
          source "${{ github.workspace }}/infra/bootstrapping/sdk_helpers.sh";
          source "${{ github.workspace }}/infra/bootstrapping/init_environment.sh";
          bash -x ./run-job.sh jobs/pipelines/tensorflow-image-segmentation/pipeline.yml
      working-directory: cli/
    - name: validate readme
      run: |
          python check-readme.py "${{ github.workspace }}/cli/"
      working-directory: infra/bootstrapping
      continue-on-error: false
