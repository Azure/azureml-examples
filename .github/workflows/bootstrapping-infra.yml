name: bootstrapping-infra

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug flag for workflows'
        type: boolean
        required: false
        default: false
      bootstrap:
        description: 'To bootstrap resources or not'
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "0 */6 * * *"
  pull_request:
    branches:
      - main
    paths:
      - sdk/**
      - .github/workflows/bootstrapping-infra.yml
      - cli/**
      - infra/bootstrapping/**

permissions:
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
      debug: ${{ github.event.inputs.debug || false }}
    steps:
    - name: check out repo
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: setup python
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
      with: 
        python-version: "${{ vars.AZUREML_NOTEBOOKS_PYTHON_VERSION || '3.13' }}"
    - name: pip install notebook reqs
      run: pip install -r sdk/python/dev-requirements.txt
    - name: azure login
      uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d # v1.6.1
      with:
        client-id: ${{ secrets.OIDC_AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.OIDC_AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.OIDC_AZURE_SUBSCRIPTION_ID }}
    - name: bootstrap infra resources
      run: |
          [[ -z "${RUN_BOOTSTRAP:-}" ]] && RUN_BOOTSTRAP='true'
          echo '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}';
          bash bootstrap.sh
      working-directory: infra/bootstrapping
      continue-on-error: true
